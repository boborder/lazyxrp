name: Resolve Rust toolchain
description: Prefer explicit workflow input; otherwise read channel from rust-toolchain.toml.

inputs:
  toolchain:
    description: Rust toolchain/channel (rustup). Empty reads from toolchain file.
    required: false
    default: ""
  toolchain-file:
    description: Path to rust-toolchain.toml relative to repository root.
    required: false
    default: rust-toolchain.toml

outputs:
  toolchain:
    description: Resolved value for dtolnay/rust-toolchain or rustup.
    value: ${{ steps.resolve.outputs.toolchain }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: bash "${{ github.workspace }}/.github/scripts/resolve-rust-toolchain.sh"
      env:
        TOOLCHAIN_INPUT: ${{ inputs.toolchain }}
        RUST_TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
