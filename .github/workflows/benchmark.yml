name: Benchmark

on:
  # Dispatched by cd.yml after a successful release. GITHUB_TOKEN-dispatched
  # CD runs do not fire workflow_run listeners reliably (observed: the one
  # push-tag CD fired once; five GITHUB_TOKEN-dispatched CD successes fired
  # zero benchmark runs). Dispatch with `--ref <tag>` so results measure the
  # exact released commit. Manual: gh workflow run benchmark.yml --ref <tag>.
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail on any benchmark timeout/error (--ci)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  benchmark:
    name: Build & Startup Benchmark
    # Dispatch path always; inputs.strict selects --ci failure mode.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mise tools (hyperfine)
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Install benchmark helpers
        run: |
          sudo apt-get update && sudo apt-get install -y bc jq
          if ! command -v cargo-bloat >/dev/null 2>&1; then
            cargo install cargo-bloat --locked
          fi

      - name: Run benchmark suite
        run: |
          set -euo pipefail
          ARGS=(--json --fast --perf-only)
          if [[ "${{ github.event.inputs.strict }}" == "true" ]]; then
            ARGS+=(--ci)
          fi
          ./benchmark.sh "${ARGS[@]}" 2>&1 | tee benchmark.log
          test -s benchmark-summary.json || {
            echo "benchmark-summary.json missing or empty" >&2
            exit 1
          }
        shell: bash

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-summary.json
            benchmark.log
            target/bloat-report.txt
            target/timings-report.html
          if-no-files-found: ignore

      - name: Render benchmark summary
        uses: actions/github-script@v9
        with:
          script: >-
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('benchmark-summary.json', 'utf8'));

            const rows = data.benchmarks.map(b => {
              const icon = b.result === 'PASS' ? '✅' : b.result === 'FAIL' ? '❌' : b.result === 'TIMEOUT' ? '⏱️' : '⏭️';
              const value = b.name === 'release_binary_size' ? b.message : `${b.value}${b.unit}`;
              return `| ${b.name} | ${icon} ${b.result} | ${value} | ${b.message} |`;
            }).join('\n');

            let cacheSection = '';
            if (data.cache_comparison) {
              const c = data.cache_comparison;
              cacheSection = `\n### 📦 Cache Comparison (Cold vs Warm)\n\n| Metric | Value |\n|--------|-------|\n| Cold build (clean) | ${c.cold}s |\n| Warm build (cached) | ${c.warm}s |\n| Time saved | ${c.saved_seconds}s (${c.saved_percent}%) |\n`;
            }

            const summary = `## 📊 Benchmark Results\n\n| Check | Result | Value | Note |\n|-------|--------|-------|------|\n${rows}\n\n**Summary:** ${data.summary.pass} passed, ${data.summary.fail} failed, ${data.summary.skip} skipped\n${cacheSection}\n`;
            await core.summary.addRaw(summary).write();
