name: CD # Continuous Deployment

on:
  push:
    tags:
      - "[v]?[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  # Release gate: never build/publish from a commit whose CI is not green.
  # Tag pushes and workflow_dispatch both land here; the CI workflow run for
  # the tagged commit (if any) is watched to completion and must succeed.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for and verify CI on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Release commit: ${SHA}"
          RUN_ID="$(gh run list --workflow CI --commit "${SHA}" --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "::error::No CI workflow run found for commit ${SHA} — refusing to release"
            exit 1
          fi
          echo "Watching CI run ${RUN_ID} for commit ${SHA}"
          gh run watch "${RUN_ID}" --exit-status --interval 15

  build-binaries:
    name: Build ${{ matrix.os-name }} ${{ matrix.architecture }} (${{ matrix.target }})
    needs: ci-gate
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            architecture: x86_64
            binary-postfix: ""
            binary-name: lazyxrp
            use-cross: false
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            architecture: arm64
            binary-postfix: ""
            binary-name: lazyxrp
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
            binary-postfix: ""
            binary-name: lazyxrp
            use-cross: false
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            architecture: x86_64
            binary-postfix: ".exe"
            binary-name: lazyxrp
            use-cross: false
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-gnu
            architecture: arm64
            binary-postfix: ""
            binary-name: lazyxrp
            use-cross: true
          - os: ubuntu-latest
            os-name: linux
            target: i686-unknown-linux-gnu
            architecture: i686
            binary-postfix: ""
            binary-name: lazyxrp
            use-cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: ${{ matrix.use-cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Install strip (aarch64 Linux)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Package release binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          BINARY_NAME=${{ matrix.binary-name }}${{ matrix.binary-postfix }}
          if [[ ${{ matrix.target }} == aarch64-unknown-linux-gnu ]]; then
            GCC_PREFIX="aarch64-linux-gnu-"
          else
            GCC_PREFIX=""
          fi
          "${GCC_PREFIX}strip" $BINARY_NAME || true
          RP_NAME="rp${{ matrix.binary-postfix }}"
          if [[ -f "$RP_NAME" ]]; then
            "${GCC_PREFIX}strip" "$RP_NAME" || true
          else
            echo "warning: $RP_NAME missing after build" >&2
          fi
          RELEASE_NAME=${{ matrix.binary-name }}-${GITHUB_REF_NAME}-${{ matrix.os-name }}-${{ matrix.architecture }}
          if [[ -f "$RP_NAME" ]]; then
            tar czvf $RELEASE_NAME.tar.gz $BINARY_NAME "$RP_NAME"
          else
            tar czvf $RELEASE_NAME.tar.gz $BINARY_NAME
          fi
          if [[ ${{ runner.os }} == 'Windows' ]]; then
            certutil -hashfile $RELEASE_NAME.tar.gz sha256 | grep -E [A-Fa-f0-9]{64} > $RELEASE_NAME.sha256
          else
            shasum -a 256 $RELEASE_NAME.tar.gz > $RELEASE_NAME.sha256
          fi

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os-name }}-${{ matrix.architecture }}-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.binary-name }}-*.sha256
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is often read-only; releases need write on contents.
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cargo:
    name: Publishing to Cargo
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
