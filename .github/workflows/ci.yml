name: CI # Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-features --workspace

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy check
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --all-features --workspace --examples

  # Cargo.toml version bump on main → tag → CD (GitHub Release + crates.io).
  # Path filter intentionally omitted: real releases always touch src/ and Cargo.lock.
  auto-tag:
    name: Auto Tag Release
    needs: [test, rustfmt, clippy, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag when Cargo.toml version bumps
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial or force push — skipping auto-tag"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE:Cargo.toml" 2>/dev/null; then
            echo "No Cargo.toml at $BEFORE — skipping"
            exit 0
          fi

          OLD_VERSION=$(git show "$BEFORE:Cargo.toml" | grep -m1 '^version = ' | sed -E 's/^version = "([^"]+)"/\1/')
          NEW_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')

          if [ -z "$OLD_VERSION" ] || [ -z "$NEW_VERSION" ]; then
            echo "Could not parse Cargo.toml version — skipping"
            exit 0
          fi

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Cargo.toml version unchanged ($NEW_VERSION) — skipping"
            exit 0
          fi

          TAG="v${NEW_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi

          echo "Version bump detected: $OLD_VERSION → $NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — CD workflow will build and publish"
