version: 2
updates:
  # Keeps the SHA-pinned actions current (the `# vN` comments are updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # dev-dep must match the 0.24 tree xrpl-rust pulls in; drop when xrpl-rust upgrades.
      - dependency-name: tokio-tungstenite
        versions: [">=0.25"]
