[package]
name = "lazyxrp"
version = "0.8.0"
edition = "2024"
rust-version = "1.94.1"
description = "Terminal UI and CLI for the XRP Ledger: watch accounts, order books, NFTs and AMM pools; sign payments and DEX offers (simulate-first, mainnet guarded)"
authors = ["boborder"]
license = "MIT"
repository = "https://github.com/boborder/lazyxrp"
homepage = "https://github.com/boborder/lazyxrp"
documentation = "https://docs.rs/lazyxrp"
readme = "README.md"
keywords = ["xrpl", "xrp", "tui", "dex", "wallet"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies", "visualization"]
# crates.io allowlist (gitignore patterns; leading `/` = package root only).
# GitHub-only: docs/ (internal design docs), workflows, install.sh. DESIGN.md stays: TC-128 reads it.
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/config.json5",
    "/DESIGN.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/README.md",
    "/.env.example",
]
autobins = false
build = "build.rs"

# No doctests, and bins hold no unit tests (cli_smoke covers them): skip those test targets.
[lib]
doctest = false

[[bin]]
name = "lazyxrp"
path = "src/main.rs"
test = false

[[bin]]
name = "rp"
path = "src/bin/rp.rs"
test = false

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "cargo", "wrap_help", "unicode", "string"] }
color-eyre = "0.6"
# xrpl-rust / embassy-sync needs the host critical-section implementation.
critical-section = { version = "1.2.0", features = ["std"] }
crossterm = { version = "0.29", features = ["serde", "event-stream"] }
directories = "6"
futures = "0.3"
hex = "0.4"
json5 = "1"
libc = "0.2"
ratatui = { version = "0.30", features = ["serde", "macros"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
] }
# CancellationToken only — skip codec/io/time/net default features.
tokio-util = { version = "0.7", default-features = false }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
secrecy = { version = "0.10", features = ["serde"] }
kobe-xrpl = "3.4"
kobe-primitives = { version = "3.4", default-features = false, features = ["bip32", "encoding"] }
xrpl-rust = "1.1"
# native-tls (not default rustls/aws-lc-rs): aws-lc-sys alone is ~7 min of a clean build.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "charset", "http2", "system-proxy"] }
alloy = { version = "2", default-features = false, features = ["std", "reqwest", "reqwest-native-tls", "essentials"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Linux GNU only: vendored OpenSSL so `cross` targets (i686/aarch64) do not need target
# OpenSSL dev packages. Omit on Windows/macOS — MSVC+vendored needs Perl modules GitHub
# runners often lack; those platforms use Schannel/Secure Transport via `native-tls`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# Already in the tree via xrpl-rust; local WebSocket fixture server for ws.rs tests.
tokio-tungstenite = "0.24"

[build-dependencies]
vergen-gix = { version = "9", features = ["build"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# Size-oriented release (also used by `cargo install` / CD). https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
