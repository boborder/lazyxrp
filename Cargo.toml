[package]
name = "lazyxrp"
version = "0.1.20"
edition = "2024"
rust-version = "1.91"
description = "Terminal UI for the XRP Ledger — monitor accounts, order books, NFTs, trust lines, and AMM pools"
authors = ["boborder"]
license = "MIT"
repository = "https://github.com/boborder/lazyxrp"
homepage = "https://github.com/boborder/lazyxrp"
readme = "README.md"
keywords = ["xrpl", "tui", "cli", "monitoring", "ledger"]
categories = ["command-line-utilities", "visualization"]
build = "build.rs"

[[bin]]
name = "lazyxrp"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
better-panic = "0.3"
clap = { version = "4", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6"
config = "0.15"
crossterm = { version = "0.29", features = ["serde", "event-stream"] }
directories = "6"
futures = "0.3"
human-panic = "2"
json5 = "1"
lazy_static = "1.5"
libc = "0.2"
pretty_assertions = "1"
ratatui = { version = "0.30", features = ["serde", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
strip-ansi-escapes = "0.2"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-error = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "serde"] }
critical-section = { version = "1.2", features = ["std"] }
secrecy = { version = "0.10", features = ["serde"] }
xrpl-rust = "1.1"
url = "2"
reqwest = { version = "0.13", features = ["json"] }
alloy = { version = "1", features = ["full"] }
# Linux GNU only: vendored OpenSSL so `cross` targets (i686/aarch64) do not need target
# OpenSSL dev packages. Omit on Windows/macOS — MSVC+vendored needs Perl modules GitHub
# runners often lack; those platforms use Schannel/Secure Transport via `native-tls`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
anyhow = "1"
vergen-gix = { version = "9", features = ["build", "cargo"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
