# cargo-deny config — keep dependency advisories / licenses under review.
[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0235 (rkyv 0.7.46, out-of-bounds read on Rc/Arc archives):
  # locked via rust_decimal's optional `rkyv` feature, which no workspace
  # member enables — rkyv never compiles. No patched 0.7.x; upstream fix
  # requires rkyv 0.8, which rust_decimal has not migrated to.
  { id = "RUSTSEC-2026-0235", reason = "rust_decimal optional rkyv feature not enabled; dependency never compiled" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
