# cargo-deny config — keep dependency advisories / licenses under review.
[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is transitive through xrpl-rust; no safe upstream upgrade" },
  { id = "RUSTSEC-2024-0436", reason = "paste is transitive through Alloy; no compatible replacement in current dependency graph" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "NCSA",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Many transitive duplicates exist, so multiple-versions stays "warn". This pins the one
# we control: tungstenite must stay on the 0.24 tree xrpl-rust uses (see dependabot.yml).
deny = [
  { name = "tungstenite", version = ">=0.25" },
  { name = "tokio-tungstenite", version = ">=0.25" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
