# cargo-deny config — keep dependency advisories / licenses under review.
[advisories]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "allow"
ignore = [
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is transitive through xrpl-rust; no safe upstream upgrade" },
  { id = "RUSTSEC-2024-0388", reason = "derivative is transitive and unmaintained; no compatible upstream replacement" },
  { id = "RUSTSEC-2024-0436", reason = "paste is transitive through Alloy; no compatible replacement in current dependency graph" },
  # locked via rust_decimal's optional `rkyv` feature, which no workspace
  # member enables — rkyv never compiles. No patched 0.7.x; upstream fix
  # requires rkyv 0.8, which rust_decimal has not migrated to.
  { id = "RUSTSEC-2026-0235", reason = "rust_decimal optional rkyv feature not enabled; dependency never compiled" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "NCSA",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
