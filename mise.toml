# Dev toolchain & task runner (run from repo root: mise run <task>).
# Toolchain truth: rust-toolchain.toml (stable + rustfmt/clippy); `rust` here
# provisions the same channel via mise (its shims shadow rustup's).
[tools]
rust = "stable"
# cargo backend: the prebuilt GitHub asset resolves to x86_64 on arm64 macOS (no Rosetta → "Bad CPU type").
"cargo:hyperfine" = "latest"
# CI security-advisories parity (`.github/workflows/ci.yml`): cargo-audit and cargo-deny (ignores in deny.toml and .cargo/audit.toml).
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
# benchmark.sh --full runs cargo bloat; without it that step SKIPs.
"cargo:cargo-bloat" = "latest"
# `mise run demo` renders docs/demo.gif with vhs (it also needs ttyd and ffmpeg on PATH, plus a Nerd Font).
"aqua:charmbracelet/vhs" = "latest"

# https://mise.jdx.dev/tasks/ — run from repo root: mise run install
[tasks.install]
description = "Source ./install.sh from repo root (same as curl installer; INSTALL_DIR / --method / see install.sh --help)"
run = ". ./install.sh -q"

[tasks.tags]
description = "List local git tags"
run = "git tag -l"

# --- Development loop (mirrors CI gates; see AGENTS.md execution contract) ---

[tasks.check]
description = "cargo check --locked --all-features --workspace (contract minimum)"
run = "cargo check --locked --all-features --workspace"

[tasks.fmt]
description = "Apply rustfmt to the workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "CI Rustfmt + Clippy gates"
run = "cargo fmt --all --check && cargo clippy --locked --all-targets --all-features --workspace -- -D warnings"

[tasks.test]
description = "CI Test Suite gate"
run = "cargo test --locked --all-features --workspace"

[tasks.test-serial]
description = "Test suite single-threaded (env-order-sensitive checks; caught cli_smoke races)"
run = "cargo test --locked --all-features --workspace -- --test-threads=1"

[tasks.e2e-testnet]
description = "Opt-in live testnet E2E: faucet → send → offer-create → offers → offer-cancel, and faucet → nft-mint → nfts → nft-burn → nfts, all validated (public faucet; not in CI)"
run = "cargo test --locked --test testnet_e2e -- --ignored --nocapture --test-threads=1"

[tasks.doc]
description = "CI Docs gate: rustdoc with -D warnings"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --locked --no-deps --document-private-items --all-features --workspace"

[tasks.audit]
description = "CI Security Advisories gate: cargo-audit + cargo-deny (ignores in deny.toml and .cargo/audit.toml)"
run = "cargo audit && cargo deny check"

[tasks.update]
description = "Update Cargo.lock within semver, then rebuild-check + advisory rescan + stale-cache sweep (replaced dependency versions leave their old builds behind)"
run = "cargo update && mise run check && mise run audit && mise run gc-auto"

[tasks.clean]
description = "Remove build artifacts (target/, benchmark outputs)"
run = "cargo clean && rm -f benchmark-summary.json"

# --- Local build-cache hygiene (dev machines only; no CI workflow runs these) ---

[tasks.gates]
description = "The dev loop's finish line, in order: lint, test, doc, then gc-auto"
run = ["mise run lint", "mise run test", "mise run doc", "mise run gc-auto"]

[tasks.gc]
description = "Free disk by dropping stale build cache: orphaned debug objects, idle incremental sessions, files unread for DAYS (default 3). Keeps what the last build used. Usage: mise run gc [days]"
run = '''
#!/usr/bin/env bash
set -euo pipefail
DAYS="${1:-3}"
[[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "error: days must be a whole number" >&2; exit 1; }
[ -d target ] || { echo "gc: no target/ — nothing to do"; exit 0; }
kb() { du -sk target | cut -f1; }
before=$(kb)

# 1. macOS keeps one debug object (.o) per codegen unit per build and cargo never removes the old
# ones: ~6 GB after a day of edits. Only debuggers read them (cargo does not track them), so drop
# each unit's .o files that predate its newest lib/exe by more than 10 minutes. Linux leaves none.
if [ "$(uname)" = Darwin ]; then
  find target -type d -name deps -not -path '*/build/*' | while read -r deps; do
    find "$deps" -maxdepth 1 -type f -exec stat -f '%m %N' {} + 2>/dev/null | awk '
      { m = $1; n = $0; sub(/^[0-9]+ /, "", n); f = n; sub(/.*\//, "", f)
        if (f ~ /\.o$/) { u = f; sub(/\..*/, "", u); obj[++c] = n; om[c] = m; ou[c] = u; next }
        if (f ~ /\.(d|rmeta|json)$/) next
        u = f; sub(/^lib/, "", u); sub(/\.(rlib|dylib|a)$/, "", u)
        if (u ~ /^[A-Za-z0-9_]+-[0-9a-f]{16}$/ && m > newest[u]) newest[u] = m }
      END { for (i = 1; i <= c; i++) if ((ou[i] in newest) && om[i] < newest[ou[i]] - 600) print obj[i] }' \
      | tr '\n' '\0' | xargs -0 rm -f
  done
fi

# 2. Incremental sessions nobody has touched for DAYS (cargo never prunes them).
find target -type d -path '*/incremental/*/s-*' -mtime +"$DAYS" -prune -exec rm -rf {} +

# 3. Anything else no build has read for DAYS (cargo-sweep's rule): old profiles, other targets,
# superseded dependency versions. Cargo rebuilds a missing artifact; it never fails on one.
find target -type f -atime +"$DAYS" -not -name CACHEDIR.TAG -delete
find target -type d -empty -delete

after=$(kb)
printf 'gc: target %.1f -> %.1f GB (freed %.1f GB), %.1f GB free on disk\n' \
  "$(echo "$before / 1048576" | bc -l)" "$(echo "$after / 1048576" | bc -l)" \
  "$(echo "($before - $after) / 1048576" | bc -l)" \
  "$(df -k . | awk 'NR==2 {print $4 / 1048576}')"
'''

[tasks.gc-auto]
description = "Run gc only when target/ is over GC_MAX_GB (default 8) or the disk has less than GC_MIN_FREE_GB (default 20) free"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ -d target ] || exit 0
used=$(( $(du -sk target | cut -f1) / 1048576 ))
free=$(( $(df -k . | awk 'NR==2 {print $4}') / 1048576 ))
if [ "$used" -ge "${GC_MAX_GB:-8}" ] || [ "$free" -lt "${GC_MIN_FREE_GB:-20}" ]; then
  mise run gc
else
  echo "gc-auto: target ${used} GB, ${free} GB free — nothing to do"
fi
'''

# --- Benchmarks ---

[tasks.bench]
description = "Full benchmark (cold build + check/test/clippy/doc; ~10 min)"
run = "./benchmark.sh --full"

[tasks.demo]
description = "Render docs/demo.gif (README demo) from docs/demo.tape with vhs; read-only, scrubbed env, throwaway config dirs"
run = "cargo build --locked && vhs docs/demo.tape"

[tasks.bench-fast]
description = "Fast perf benchmark (skips clean build + quality gates; ~3 min)"
run = "./benchmark.sh --fast --perf-only"

[tasks.bench-ci]
description = "CI-equivalent benchmark (--json --fast --perf-only)"
run = "./benchmark.sh --json --fast --perf-only"

# Usage: mise run release 0.3.1 — bump + Cargo.lock sync + CHANGELOG cut + gates + ONE commit. Push yourself (CI auto-tags).
[tasks.release]
description = "Bump Cargo.toml version, sync Cargo.lock, date CHANGELOG [Unreleased], run lint/test gates, commit 'chore: release <ver>' (no push)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
NEW="${1:?usage: mise run release <x.y.z>}"
[[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: version must be x.y.z" >&2; exit 1; }
[ "$(git branch --show-current)" = main ] || { echo "error: not on main" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "error: worktree not clean" >&2; exit 1; }
git rev-parse "v$NEW" >/dev/null 2>&1 && { echo "error: tag v$NEW exists" >&2; exit 1; }
PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
grep -q '^## \[Unreleased\]$' CHANGELOG.md || { echo "error: CHANGELOG.md has no ## [Unreleased]" >&2; exit 1; }
awk '/^## \[Unreleased\]$/{u=1;next} u&&/^## \[/{exit} u&&/^- /{f=1} END{exit !f}' CHANGELOG.md || { echo "error: CHANGELOG.md [Unreleased] has no entries" >&2; exit 1; }
awk -v v="$NEW" '!done && /^version = /{sub(/"[^"]+"/, "\"" v "\""); done=1} 1' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
# Unreleased → "## [NEW] - date" (fresh empty Unreleased above it) and compare links.
awk -v v="$NEW" -v d="$(date +%F)" -v prev="$PREV" -v repo="https://github.com/boborder/lazyxrp" '
  /^## \[Unreleased\]$/ && !h { print; print ""; print "## [" v "] - " d; h=1; next }
  /^\[Unreleased\]: / { print "[Unreleased]: " repo "/compare/v" v "...HEAD"; print "[" v "]: " repo "/compare/" prev "...v" v; next }
  { print }' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
cargo update -p lazyxrp --offline
mise run lint
mise run test
git commit -q -m "chore: release $NEW" Cargo.toml Cargo.lock CHANGELOG.md
git log --oneline -1
'''

# Cargo.toml を必ず更新する
[tasks.tag-push]
description = "Create v<version> from Cargo.toml and push that single tag to origin (gates first)"
depends = ["lint", "test", "doc", "audit"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
TAG="v${VERSION}"
if git rev-parse "$TAG" >/dev/null 2>&1; then
  echo "error: tag $TAG already exists" >&2
  exit 1
fi
git tag -a "$TAG" -m "Release $TAG"
git push origin "$TAG"
'''
