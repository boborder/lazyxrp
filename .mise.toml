[tools]
rust = "stable"
# cargo-binstall = "latest"

# https://mise.jdx.dev/tasks/ — run from repo root: mise run install
[tasks.install]
description = "Source ./install.sh from repo root (same as curl installer; INSTALL_DIR / --method / see install.sh --help)"
run = ". ./install.sh -q"

[tasks.tags]
description = "List local git tags"
run = "git tag -l"

# Cargo.toml を必ず更新する
[tasks.tag-push]
description = "Create v<version> from Cargo.toml and push that single tag to origin"
run = '''
#!/usr/bin/env bash
set -euo pipefail
VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
TAG="v${VERSION}"
if git rev-parse "$TAG" >/dev/null 2>&1; then
  echo "error: tag $TAG already exists" >&2
  exit 1
fi
git tag -a "$TAG" -m "Release $TAG"
git push origin "$TAG"
'''
