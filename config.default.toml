# Built-in defaults merged by `Config::new` under the user config.toml: only keybindings and
# styles are read from this file. Every other setting default lives in src/config/defaults.rs.
[keybindings.Splash]
"<q>" = "Quit"  # Quit the application
"<Ctrl-d>" = "Quit"  # Another way to quit
"<Ctrl-c>" = "Quit"  # Yet another way to quit
"<Ctrl-z>" = "Suspend"  # Suspend the application
"<r>" = "RefreshAccount"
"<b>" = "RefreshBook"
"<o>" = "RefreshLedgerObjects"
"<Ctrl-n>" = "NetworkSwitchCycle"
"<j>" = "SelectNext"
"<k>" = "SelectPrev"
"<down>" = "SelectNext"
"<up>" = "SelectPrev"
"<h>" = "FocusPrev"
"<l>" = "FocusNext"
"<right>" = "FocusNext"
"<left>" = "FocusPrev"
"<enter>" = "TxDetailToggle"
"<?>" = "Help"
